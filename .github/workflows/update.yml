name: Update F500Tracker jobs

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-f500tracker-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Update job listings
        run: python run.py update

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/jobs.json data/enrichment_cache.json docs/jobs.json jobs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update F500Tracker jobs"
            git pull --rebase origin main
            git push origin main
          fi
