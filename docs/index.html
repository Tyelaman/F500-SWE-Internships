<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F500Tracker</title><link rel="stylesheet" href="styles.css"></head>
<body><header><a href="../README.md">F500Tracker</a><h1>Sponsorship-supported Fortune 500 jobs</h1><p>Only U.S. positions with strong posting-level evidence of H-1B/employment visa sponsorship support are published.</p></header>
<main><form id="filters"><label>Search<input id="search" type="search" placeholder="Title, company, location, keyword"></label><label>Employment type<select id="type"><option value="">All</option><option value="internship">Internship</option><option value="full-time">Full-time</option></select></label><label>Category<select id="category"><option value="">All</option></select></label><label>Company<select id="company"><option value="">All</option></select></label><label>Location<input id="location" type="search"></label><label>Minimum salary<input id="salary" type="number" min="0" step="1000"></label><label>Keywords<input id="keywords" type="search"></label><button type="reset">Reset filters</button></form><p id="count" aria-live="polite">Loading jobs…</p><section id="results"></section><button id="more" hidden>Load more</button></main><script src="app.js"></script></body></html>
